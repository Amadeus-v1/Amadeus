<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadeus - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand"><h1>🎭 Amadeus</h1></div>
                <div class="nav-menu">
                    <div class="theme-toggle-container">
                        <span class="theme-label">Mode</span>
                        <label class="switch"><input type="checkbox" id="themeCheckbox"><span class="slider"></span></label>
                    </div>
                    <span id="userGreeting" class="nav-user">Welcome!</span>
                    <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </nav>

        <div class="dashboard-container">
            <div class="breadcrumb" style="margin-bottom: 24px;">
                <a href="dashboard.html" style="color: var(--accent); text-decoration: none; font-weight: 700;">← Back to Dashboard</a>
            </div>

            <!-- Profile Header -->
            <div id="profileHeader" class="feature-section" style="text-align: center; padding: 40px;">
                <p style="color: var(--muted);">Loading profile...</p>
            </div>

            <!-- Profile Content (two columns) -->
            <div id="profileContent" class="hidden" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px;">
                <!-- Left: Info -->
                <div>
                    <!-- Bio -->
                    <div class="feature-section">
                        <h2 style="margin-bottom: 12px;">📝 About</h2>
                        <p id="profileBio" style="color: var(--muted); white-space: pre-wrap;"></p>
                    </div>

                    <!-- Favorite Genres -->
                    <div class="feature-section">
                        <h2 style="margin-bottom: 12px;">🎵 Favorite Genres</h2>
                        <div id="profileGenres" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
                    </div>

                    <!-- Member Info -->
                    <div class="feature-section">
                        <h2 style="margin-bottom: 12px;">📅 Member Since</h2>
                        <p id="profileCreated" style="color: var(--muted);"></p>
                    </div>
                </div>

                <!-- Right: Collection Stats + Recent -->
                <div>
                    <div class="feature-section">
                        <h2 style="margin-bottom: 16px;">📊 Collection Stats</h2>
                        <div id="profileStats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;"></div>
                    </div>

                    <div class="feature-section">
                        <h2 style="margin-bottom: 16px;">🕐 Recent Additions</h2>
                        <div id="profileRecent" class="collections-list" style="max-height: 400px; overflow-y: auto;"></div>
                    </div>
                </div>
            </div>

            <!-- Edit Modal -->
            <div id="editModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center;">
                <div class="feature-section" style="width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; background: var(--card-bg); position: relative;">
                    <button onclick="closeEditModal()" style="position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer;">&times;</button>
                    <h2 style="margin-bottom: 20px;">Edit Profile</h2>
                    <form id="editForm" style="display: flex; flex-direction: column; gap: 16px;">
                        <div>
                            <label style="font-weight: 700; font-size: 0.85rem;">Display Name</label>
                            <input type="text" id="editDisplayName" placeholder="Your display name" style="margin-top: 4px;">
                        </div>
                        <div>
                            <label style="font-weight: 700; font-size: 0.85rem;">Bio</label>
                            <textarea id="editBio" rows="4" placeholder="Tell people about yourself..." style="margin-top: 4px; width: 100%; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); padding: 12px; font-family: inherit; resize: vertical;"></textarea>
                        </div>
                        <div>
                            <label style="font-weight: 700; font-size: 0.85rem;">Avatar URL</label>
                            <input type="url" id="editAvatarUrl" placeholder="https://example.com/avatar.jpg" style="margin-top: 4px;">
                        </div>
                        <div>
                            <label style="font-weight: 700; font-size: 0.85rem;">Favorite Genres <span style="font-weight:400;color:var(--muted);">(comma separated)</span></label>
                            <input type="text" id="editGenres" placeholder="Rock, Jazz, Electronic..." style="margin-top: 4px;">
                        </div>
                        <div style="display: flex; gap: 12px; margin-top: 8px;">
                            <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
                            <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer class="dashboard-footer">
            <p>🎭 Amadeus - Your Collection Companion</p>
        </footer>
    </div>

    <script src="theme.js"></script>
    <script src="profile.js"></script>
</body>
</html>
