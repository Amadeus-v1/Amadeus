<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadeus - Friends</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <h1>🎭 Amadeus</h1>
                </div>
                <div class="nav-menu">
                    <div class="theme-toggle-container">
                        <span class="theme-label">Mode</span>
                        <label class="switch">
                            <input type="checkbox" id="themeCheckbox">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <span id="userGreeting" class="nav-user">Welcome!</span>
                    <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Main Container -->
        <div class="dashboard-container">
            <div class="breadcrumb" style="margin-bottom: 24px;">
                <a href="dashboard.html" style="color: var(--accent); text-decoration: none; font-weight: 700;">← Back to Dashboard</a>
            </div>

            <header class="dashboard-header">
                <h1>👥 Friends</h1>
                <p>Connect with other collectors and see their libraries</p>
            </header>

            <main class="dashboard-main">
                <!-- Add Friend Section -->
                <div class="feature-section">
                    <h2>Add Friend</h2>
                    <form id="addFriendForm" style="display: flex; gap: 12px; margin-top: 16px;">
                        <input 
                            type="text" 
                            id="friendUsername" 
                            placeholder="Enter friend's username..." 
                            required
                            style="flex: 1;"
                        >
                        <button type="submit" class="btn btn-primary">Send Request</button>
                    </form>
                    <div id="formMessage" class="error-message hidden" style="margin-top: 16px;"></div>
                </div>

                <!-- Friends List Section -->
                <div class="feature-section">
                    <h2>My Friends</h2>
                    <div id="friendsList" class="collections-list" style="margin-top: 16px;">
                        <p style="color: var(--muted);">Loading friends...</p>
                    </div>
                </div>

                <!-- Friends' Collections Preview -->
                <div class="feature-section">
                    <h2>Friends' Recent Items</h2>
                    <div id="friendsCollectionContainer" class="collections-list" style="margin-top: 16px;">
                        <p style="color: var(--muted);">Checking for updates from friends...</p>
                    </div>
                </div>
            </main>
        </div>

        <footer class="dashboard-footer">
            <p>🎭 Amadeus - Your Collection Companion</p>
        </footer>
    </div>

    <script src="theme.js"></script>
    <script src="friends.js"></script>
</body>
</html>
