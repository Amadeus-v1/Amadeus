<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadeus - My Wishlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <h1>🎭 Amadeus</h1>
                </div>
                <div class="nav-menu">
                    <div class="theme-toggle-container">
                        <span class="theme-label">Mode</span>
                        <label class="switch">
                            <input type="checkbox" id="themeCheckbox">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <span id="userGreeting" class="nav-user">Welcome!</span>
                    <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Main Dashboard Container -->
        <div class="dashboard-container">
            <div class="breadcrumb" style="margin-bottom: 24px;">
                <a href="dashboard.html" style="color: var(--accent); text-decoration: none; font-weight: 700;">← Back to Dashboard</a>
            </div>

            <header class="dashboard-header">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px;">
                    <div>
                        <h1>✨ My Wishlist</h1>
                        <p>Track items you want to add to your collection</p>
                    </div>
                    <a href="explore.html" class="btn btn-primary" style="text-decoration: none;">🔍 Find Items</a>
                </div>
            </header>

            <main class="dashboard-main">
                <!-- Wishlist Stats -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-bottom: 48px;">
                    <div class="feature-section" style="margin-bottom: 0; text-align: center;">
                        <div style="font-size: 2.5rem; font-weight: 800; color: var(--accent);" id="totalWishlistItems">0</div>
                        <div style="font-size: 0.9rem; font-weight: 700; color: var(--muted); text-transform: uppercase;">Items on Wishlist</div>
                    </div>
                </div>

                <!-- Filters and Search -->
                <div style="display: flex; flex-direction: column; gap: 24px; margin-bottom: 48px;">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="🔍 Search wishlist items..."
                    >
                </div>

                <!-- Items Container -->
                <div id="wishlistContainer" class="collections-list">
                    <p style="text-align: center; color: var(--muted); padding: 40px;">Loading your wishlist...</p>
                </div>
            </main>
        </div>

        <!-- Item Detail Modal -->
        <div id="itemModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center;">
            <div class="feature-section" style="width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; background: var(--card-bg); position: relative;">
                <button onclick="closeItemModal()" style="position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text); font-size: 2rem; cursor: pointer;">&times;</button>
                <h2 id="modalTitle" style="padding-right: 40px;"></h2>
                <div id="modalBody" style="margin: 24px 0;"></div>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button class="btn btn-secondary" onclick="closeItemModal()">Close</button>
                    <button class="btn btn-primary" onclick="moveToCollection()">I Got This!</button>
                    <button class="btn btn-secondary" style="color: #ff4444; border-color: #ff4444;" onclick="deleteWishlistItem()">Remove</button>
                </div>
            </div>
        </div>

        <footer class="dashboard-footer">
            <p>🎭 Amadeus - Your Collection Companion</p>
        </footer>
    </div>

    <script src="theme.js"></script>
    <script src="wishlist.js"></script>
</body>
</html>
