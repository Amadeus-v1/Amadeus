<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadeus - Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <h1>🎭 Amadeus</h1>
                </div>
                <div class="nav-menu">
                    <div class="theme-toggle-container">
                        <span class="theme-label">Mode</span>
                        <label class="switch">
                            <input type="checkbox" id="themeCheckbox">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <span id="userGreeting" class="nav-user">Welcome!</span>
                    <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Main Container -->
        <div class="dashboard-container">
            <div class="breadcrumb" style="margin-bottom: 24px;">
                <a href="dashboard.html" style="color: var(--accent); text-decoration: none; font-weight: 700;">← Back to Dashboard</a>
            </div>

            <header class="dashboard-header">
                <h1>🛍️ Marketplace</h1>
                <p>Buy and trade items with other collectors worldwide</p>
            </header>

            <main class="dashboard-main">
                <!-- Search and Filters (Optional for now) -->
                <div class="feature-section" style="margin-bottom: 32px; padding: 24px;">
                    <input 
                        type="text" 
                        id="marketplaceSearch" 
                        placeholder="🔍 Search items for sale..."
                        style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text);"
                    >
                </div>

                <!-- Listings Grid -->
                <div id="marketplaceContainer" class="collections-list">
                    <p style="text-align: center; color: var(--muted); padding: 40px;">Browsing active listings...</p>
                </div>
            </main>
        </div>

        <!-- Buy Modal -->
        <div id="buyModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center;">
            <div class="feature-section" style="width: 90%; max-width: 500px; background: var(--card-bg); position: relative;">
                <button onclick="closeBuyModal()" style="position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text); font-size: 2rem; cursor: pointer;">&times;</button>
                <h2 id="buyModalTitle">Purchase Item</h2>
                <div id="buyModalBody" style="margin: 24px 0;"></div>
                <div style="display: flex; gap: 12px;">
                    <button class="btn btn-primary" onclick="confirmPurchase()">Confirm Buy</button>
                    <button class="btn btn-secondary" onclick="closeBuyModal()">Cancel</button>
                </div>
            </div>
        </div>

        <footer class="dashboard-footer">
            <p>🎭 Amadeus - Your Collection Companion</p>
        </footer>
    </div>

    <script src="theme.js"></script>
    <script src="marketplace.js"></script>
</body>
</html>
