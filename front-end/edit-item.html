<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadeus - Edit Item</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <h1>🎭 Amadeus</h1>
                </div>
                <div class="nav-menu">
                    <span id="userGreeting" class="nav-user">Welcome!</span>
                    <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Main Dashboard Container -->
        <div class="dashboard-container">
            <div class="breadcrumb">
                <a href="collection.html" class="breadcrumb-link">← Back to Collection</a>
            </div>

            <header class="dashboard-header">
                <h1>✏️ Edit Item</h1>
                <p>Update information about this media item</p>
            </header>

            <main class="dashboard-main">
                <!-- Edit Item Form -->
                <form id="editItemForm" class="add-item-form">
                    <div class="form-section">
                        <h2>Basic Information</h2>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="itemTitle">Title *</label>
                                <input 
                                    type="text" 
                                    id="itemTitle" 
                                    placeholder="e.g., The Great Gatsby, Dark Side of the Moon"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="itemMediaType">Media Type *</label>
                                <select id="itemMediaType" required>
                                    <option value="">Select media type...</option>
                                    <option value="Book">📖 Book</option>
                                    <option value="Vinyl">🎵 Vinyl Record</option>
                                    <option value="CD">💿 CD</option>
                                    <option value="DVD">🎬 DVD</option>
                                    <option value="Blu-ray">📀 Blu-ray</option>
                                    <option value="Cassette">📼 Cassette Tape</option>
                                    <option value="Video Game">🎮 Video Game</option>
                                    <option value="Collectible">✨ Collectible</option>
                                    <option value="Comic">💭 Comic/Manga</option>
                                    <option value="Other">📦 Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="itemArtistAuthor">Artist / Author</label>
                                <input 
                                    type="text" 
                                    id="itemArtistAuthor" 
                                    placeholder="e.g., Pink Floyd, F. Scott Fitzgerald"
                                >
                            </div>

                            <div class="form-group">
                                <label for="itemYear">Release Year</label>
                                <input 
                                    type="number" 
                                    id="itemYear"
                                    placeholder="e.g., 1973"
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="itemDescription">Notes</label>
                            <textarea 
                                id="itemDescription" 
                                placeholder="Add personal notes about this item..."
                                rows="4"
                            ></textarea>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2>Details</h2>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="itemFormat">Format</label>
                                <input 
                                    type="text" 
                                    id="itemFormat" 
                                    placeholder="e.g., Hardcover, First Edition, Remaster"
                                >
                            </div>

                            <div class="form-group">
                                <label for="itemBarcode">Barcode / ISBN</label>
                                <input 
                                    type="text" 
                                    id="itemBarcode" 
                                    placeholder="ISBN, UPC, or barcode"
                                    readonly
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="itemCoverUrl">Cover Image URL</label>
                            <input 
                                type="url" 
                                id="itemCoverUrl" 
                                placeholder="https://..."
                            >
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-large">
                            ✓ Save Changes
                        </button>
                        <a href="collection.html" class="btn btn-secondary btn-large" style="text-decoration: none;">
                            Cancel
                        </a>
                        <button type="button" id="deleteBtn" class="btn btn-danger btn-large">
                            🗑️ Delete Item
                        </button>
                    </div>

                    <div id="formMessage" class="form-message hidden"></div>
                </form>
            </main>
        </div>

        <!-- Footer -->
        <footer class="dashboard-footer">
            <p>🎭 Amadeus - Your Collection Companion | Backend: <code>localhost:8080</code></p>
        </footer>
    </div>

    <script src="edit-item.js"></script>
</body>
</html>
